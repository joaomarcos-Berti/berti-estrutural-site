name: Gerar site estatico

# Roda quando o conteudo muda (edicoes feitas no painel /admin commitam content/*.json).
# Regenera todo o HTML a partir dos JSON e faz commit de volta -> Cloudflare publica.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar HTML a partir do conteudo (PowerShell)
        shell: pwsh
        run: ./build.ps1

      - name: Commitar paginas geradas (se houver mudanca)
        run: |
          git config user.name "berti-build-bot"
          git config user.email "berti-build-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma pagina mudou."
          else
            git commit -m "build: regenera HTML do site [skip ci]"
            git push
          fi
