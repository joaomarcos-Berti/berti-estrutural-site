  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: 'Open Sans', system-ui, sans-serif;
    color: #1a1a1a;
    scroll-behavior: smooth;
  }
  * { box-sizing: border-box; }
  ::selection { background: #47b6f1; color: #000; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" src="home/shared.jsx"></script>
<script type="text/babel" src="home/Hero.jsx"></script>
<script type="text/babel" src="home/Estrutura3D.jsx"></script>
<script type="text/babel" src="home/Mapa.jsx"></script>
<script type="text/babel" src="home/ComoTrabalhamos.jsx"></script>
<script type="text/babel" src="home/Categorias.jsx"></script>
<script type="text/babel" src="home/Depoimentos.jsx"></script>
<script type="text/babel" src="home/Youtube.jsx"></script>
<script type="text/babel" src="home/Blog.jsx"></script>
<script type="text/babel" src="home/CTA.jsx"></script>
<script type="text/babel" src="home/Parceiros.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const { HomeNavBar, HomeFooter, HomeHero, HomeEstrutura3D, HomeMapa, HomeCategorias, HomeYoutube, HomeDepoimentos, HomeParceiros, HomeComoTrabalhamos, HomeBlog, HomeCTA } = window;

  // Configurações fixas da home (antes ajustáveis pelo painel de edição do preview)
  const t = {
    heroAlign: "left",
    heroOverlay: 0.62,
    heroCycleMs: 6000,
    ctaSecondary: "outline",
    accent: "#47b6f1",
    marqueeSpeed: 40
  };

  function App() {
    return (
      <div style={{
        backgroundImage: ['linear-gradient(#d5e3f4 1px, transparent 1px)','linear-gradient(90deg, #d5e3f4 1px, transparent 1px)','linear-gradient(#eaf0f8 1px, transparent 1px)','linear-gradient(90deg, #eaf0f8 1px, transparent 1px)'].join(','),
        backgroundSize: '120px 120px, 120px 120px, 24px 24px, 24px 24px',
        backgroundColor: '#fbfcfe',
      }}>
        <HomeNavBar overlay />
        {/* 01 · Hero + vídeo institucional */}
        <HomeHero
          align={t.heroAlign}
          overlay={t.heroOverlay}
          cycleMs={t.heroCycleMs}
          ctaSecondary={t.ctaSecondary}
          accent={t.accent}
        />
        {/* 02 · Estrutura 3D interativa */}
        <HomeEstrutura3D />
        {/* Obras em andamento no mapa */}
        <HomeMapa />
        {/* 03 · Como trabalhamos */}
        <HomeComoTrabalhamos />
        {/* 04 · Portfólio por categoria */}
        <HomeCategorias accent={t.accent} bg="#ffffff" />
        {/* 05 · Depoimentos */}
        <HomeDepoimentos />
        {/* 06 · Vídeos de obras (YouTube) */}
        <HomeYoutube />
        {/* 07 · Blog / Notícias */}
        <HomeBlog />
        {/* 08 · CTA — Solicitar Orçamento */}
        <HomeCTA />
        {/* Parceiros (faixa de logos) + Rodapé */}
        <HomeParceiros speedSec={t.marqueeSpeed} />
        <HomeFooter />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
