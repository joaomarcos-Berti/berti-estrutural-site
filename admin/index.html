<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Berti Estrutural — Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --sidebar: #161b27;
  --card: #1e2433;
  --border: #2a3147;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --input-bg: #111827;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* ── Login ── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 30% 40%, #1e3a5f22 0%, transparent 60%),
              radial-gradient(ellipse at 80% 70%, #1e3a5f11 0%, transparent 50%),
              var(--bg);
}
.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 48px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 24px 48px rgba(0,0,0,.5);
}
.login-logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .15em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.login-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.login-sub {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 32px;
  line-height: 1.6;
}
.login-card input[type="password"],
.login-card input[type="text"] {
  width: 100%;
  padding: 12px 16px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
  transition: border-color .2s;
  font-family: monospace;
}
.login-card input:focus { border-color: var(--accent); }
.btn-primary {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, transform .1s;
}
.btn-primary:hover { background: #2563eb; }
.btn-primary:active { transform: scale(.98); }
.login-hint {
  margin-top: 20px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}
.login-hint a { color: var(--accent2); text-decoration: none; }
.error-msg {
  background: #7f1d1d33;
  border: 1px solid #ef444455;
  color: #fca5a5;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}

/* ── Layout ── */
#app { display: none; height: 100vh; overflow: hidden; }
#app.visible { display: flex; }

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 0;
}
.sidebar-logo {
  padding: 0 24px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.sidebar-logo-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--muted);
  text-transform: uppercase;
}
.sidebar-logo-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.sidebar-logo-badge {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 99px;
  letter-spacing: .08em;
  margin-top: 4px;
  text-transform: uppercase;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 24px;
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  border-radius: 0;
  transition: color .2s, background .2s;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,.04); }
.nav-item.active { color: var(--accent2); background: rgba(59,130,246,.1); }
.nav-item .nav-icon { font-size: 16px; }
.nav-count {
  margin-left: auto;
  background: var(--border);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
}
.nav-item.active .nav-count { background: rgba(59,130,246,.3); color: var(--accent2); }

.sidebar-footer {
  margin-top: auto;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}
.btn-logout {
  width: 100%;
  padding: 8px 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.btn-logout:hover { border-color: var(--danger); color: #fca5a5; }

/* ── Main content ── */
.main {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.topbar-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.topbar-right { display: flex; gap: 10px; align-items: center; }

.btn-new {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
}
.btn-new:hover { background: #2563eb; }

.content-area { padding: 24px 32px; flex: 1; }

/* ── Item cards ── */
.items-grid { display: flex; flex-direction: column; gap: 12px; }
.item-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: border-color .2s;
}
.item-card:hover { border-color: rgba(59,130,246,.4); }
.item-thumb {
  width: 72px;
  height: 52px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--border);
  flex-shrink: 0;
}
.item-info { flex: 1; min-width: 0; }
.item-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.item-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  margin-right: 6px;
}
.badge-sup { background: #1e3a5f; color: #60a5fa; }
.badge-ind { background: #1a2e1f; color: #4ade80; }
.badge-com { background: #3b1a2e; color: #f472b6; }
.badge-eng { background: #1e3a5f; color: #60a5fa; }
.badge-tec { background: #2d1f3b; color: #c084fc; }
.badge-mat { background: #3b2e1a; color: #fb923c; }
.badge-ges { background: #1a2e2e; color: #34d399; }
.badge-feat { background: #3b2e00; color: #fbbf24; }
.item-actions { display: flex; gap: 8px; }
.btn-edit {
  padding: 7px 14px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.btn-edit:hover { border-color: var(--accent); color: var(--accent2); }
.btn-delete {
  padding: 7px 14px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.btn-delete:hover { border-color: var(--danger); color: #fca5a5; }

/* ── Modal form ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 700px;
  padding: 32px;
  position: relative;
  margin: auto;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.modal-title { font-size: 20px; font-weight: 700; }
.btn-close {
  width: 36px; height: 36px;
  background: var(--border);
  border: none;
  border-radius: 8px;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  transition: all .2s;
  display: flex; align-items: center; justify-content: center;
}
.btn-close:hover { background: var(--danger); color: #fff; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1/-1; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
}
.field input, .field select, .field textarea {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  padding: 10px 14px;
  outline: none;
  transition: border-color .2s;
  font-family: inherit;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 90px; }
.field select option { background: #1e2433; }
.field-hint { font-size: 11px; color: var(--muted); }

/* Image upload area */
.img-preview-wrap {
  position: relative;
  display: inline-block;
}
.img-preview {
  width: 100%;
  height: 140px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid var(--border);
  background: var(--input-bg);
  display: block;
}
.img-placeholder {
  width: 100%;
  height: 140px;
  border-radius: 8px;
  border: 2px dashed var(--border);
  background: var(--input-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: border-color .2s;
  color: var(--muted);
  font-size: 13px;
}
.img-placeholder:hover { border-color: var(--accent); }
.img-placeholder .icon { font-size: 28px; }

.btn-upload-img {
  margin-top: 8px;
  padding: 7px 14px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
  width: 100%;
}
.btn-upload-img:hover { border-color: var(--accent); color: var(--accent2); }

/* Gallery */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.gallery-thumb-wrap {
  position: relative;
}
.gallery-thumb {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.gallery-remove {
  position: absolute;
  top: 2px; right: 2px;
  width: 20px; height: 20px;
  background: rgba(239,68,68,.9);
  border: none;
  border-radius: 4px;
  color: #fff;
  font-size: 12px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.btn-add-gallery {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 9px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.btn-add-gallery:hover { border-color: var(--accent); color: var(--accent2); }

/* Progress overlay */
.progress-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 999;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  backdrop-filter: blur(6px);
}
.progress-overlay.visible { display: flex; }
.progress-spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-text { color: var(--text); font-size: 16px; font-weight: 500; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 20px;
  font-size: 14px;
  font-weight: 500;
  transform: translateY(80px);
  opacity: 0;
  transition: all .3s;
  z-index: 9999;
  max-width: 320px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: #22c55e55; color: #86efac; }
.toast.error   { border-color: #ef444455; color: #fca5a5; }

/* Modal save bar */
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.btn-cancel {
  padding: 10px 20px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  transition: all .2s;
}
.btn-cancel:hover { border-color: var(--text); color: var(--text); }
.btn-save {
  padding: 10px 24px;
  background: var(--success);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
}
.btn-save:hover { background: #16a34a; }

.section-empty {
  text-align: center;
  padding: 64px 24px;
  color: var(--muted);
}
.section-empty .icon { font-size: 48px; margin-bottom: 16px; }
.section-empty p { font-size: 15px; }
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Berti Estrutural</div>
    <div class="login-title">Painel Administrativo</div>
    <div class="login-sub">Digite o token do GitHub para acessar o painel e gerenciar obras e blog.</div>

    <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
    <button class="btn-primary" onclick="doLogin()">Entrar →</button>

      O token é salvo no seu navegador.<br>

    </div>

<!-- ── App ── -->
<div id="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-tag">Berti Estrutural</div>
      <div class="sidebar-logo-name">Admin</div>
      <div><span class="sidebar-logo-badge">CMS</span></div>
    </div>
    <button class="nav-item active" id="nav-obras" onclick="switchTab('obras')">
      <span class="nav-icon">🏗</span> Obras
      <span class="nav-count" id="count-obras">0</span>
    </button>
    <button class="nav-item" id="nav-blog" onclick="switchTab('blog')">
      <span class="nav-icon">📝</span> Blog
      <span class="nav-count" id="count-blog">0</span>
    </button>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>

  <div class="main">

      <div class="topbar-title" id="topbar-title">Obras</div>

<!-- ── Modal ── -->

  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="btn-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- ── Progress overlay ── -->
<div class="progress-overlay" id="progress-overlay">
  <div class="progress-spinner"></div>
  <div class="progress-text" id="progress-text">Salvando…</div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<input type="file" id="file-input-cover" accept="image/*" style="display:none" />
<input type="file" id="file-input-gallery" accept="image/*" multiple style="display:none" />

<script>
// ── Config ──
const REPO  = 'joaomarcos-Berti/berti-estrutural-site';
const BRANCH = 'main';
const CAT_LABELS_OBRA = {supermercado:'Supermercado', industrial:'Industrial', comercial:'Comercial'};
const CAT_LABELS_BLOG = {engenharia:'Engenharia', tecnologia:'Tecnologia', materiais:'Materiais', gestao:'Gestão de Obra'};
const BADGE_MAP = {supermercado:'badge-sup', industrial:'badge-ind', comercial:'badge-com', engenharia:'badge-eng', tecnologia:'badge-tec', materiais:'badge-mat', gestao:'badge-ges'};

// ── State ──
let token = localStorage.getItem('berti_token') || '';
let obras = [], obrasFileSHA = '';
let posts = [], blogFileSHA = '';
let currentTab = 'obras';
let editingObra = null;   // obra object being edited
let editingPost = null;   // post object being edited
let isNew = false;


// ── localStorage cache (persists saves across refreshes even when GitHub API is stale) ──
function lcSave(key, data, cats, sha) {
  try {
    localStorage.setItem('berti_cache_' + key, JSON.stringify({data, cats, sha, ts: Date.now()}));
  } catch(e) {}
}
function lcLoad(key) {
  try {
    const d = JSON.parse(localStorage.getItem('berti_cache_' + key));
    if (d && (Date.now() - d.ts) < 20 * 60 * 1000) return d; // valid for 20 min
  } catch(e) {}
  return null;
}

// ── Bootstrap ──
(async function init() {
  if (token) {
    const ok = await loadAll();
    if (ok) showApp();
    else token = '';
  }
})();

async function doLogin() {
  const inp = document.getElementById('token-input');
  token = inp.value.trim();
  if (!token) return;
  showProgress('Verificando token…');
  const ok = await loadAll();
  hideProgress();
  if (ok) {
    localStorage.setItem('berti_token', token);
    showApp();
  } else {
    token = '';
    document.getElementById('login-error').style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('berti_token');
  location.reload();
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  renderList();
}

// ── GitHub API ──
async function ghGet(path) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}&t=${Date.now()}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3+json' },
    cache: 'no-store'
  });
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  return r.json();
}

function strToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

// Always save JSON with \uXXXX escapes for non-ASCII
// This makes the file pure ASCII so even old browsers/code read it correctly
function jsonStringifyAscii(obj) {
  return JSON.stringify(obj, null, 2)
    .replace(/[^\x00-\x7F]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4,'0'));
}

async function ghPut(path, content, sha, message) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: strToB64(content), sha, branch: BRANCH })
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || r.status); }
  return r.json();
}

async function ghUploadImage(path, base64data) {
  // Check if file exists to get SHA
  let sha = undefined;
  try {
    const ex = await ghGet(path);
    sha = ex.sha;
  } catch(e) {}
  const body = { message: `Upload imagem: ${path}`, content: base64data, branch: BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || r.status); }
  return path;
}

// ── File inputs ──
function setupFileInputs(type) {
  const coverInp = document.getElementById('file-input-cover');
  coverInp.onchange = async function() {
    const file = this.files[0]; if (!file) return;
    const slug = type === 'obra'
      ? slugify(editingObra.title || `obra-${editingObra.id}`)
      : slugify(editingPost.title || `post-${Date.now()}`);
    const ext  = file.name.split('.').pop();
    const path = type === 'obra' ? `assets/photos/${slug}-capa.${ext}` : `assets/blog/${slug}-capa.${ext}`;
    await uploadAndSet(file, path, type, 'cover');
    this.value = '';
  };

  const galleryInp = document.getElementById('file-input-gallery');
  galleryInp.onchange = async function() {
    const files = Array.from(this.files); if (!files.length) return;
    const slug = slugify(editingObra.title || `obra-${editingObra.id}`);
    showProgress('Enviando fotos…');
    for (let i = 0; i < files.length; i++) {
      const ext  = files[i].name.split('.').pop();
      const idx  = (editingObra.gallery||[]).length + i + 1;
      const path = `assets/photos/${slug}-${String(idx).padStart(2,'0')}.${ext}`;
      await uploadAndSet(files[i], path, 'obra', 'gallery');
    }
    hideProgress();
    toast('Fotos adicionadas!', 'success');
    this.value = '';
  };
}

function triggerCoverUpload() {
  document.getElementById('file-input-cover').click();
}
function triggerGalleryUpload() {
  document.getElementById('file-input-gallery').click();
}

async function uploadAndSet(file, path, type, field) {
  showProgress('Enviando imagem…');
  try {
    const b64 = await fileToBase64(file);
    await ghUploadImage(path, b64);

    if (field === 'cover') {
      if (type === 'obra') editingObra.cover = path;
      else editingPost.cover = path;

      const prev = document.getElementById('cover-preview');
      if (prev) { prev.src = path; prev.outerHTML = `<img class="img-preview" src="${path}" id="cover-preview" />`; }
      const hint = document.getElementById('cover-path-hint');
      if (hint) hint.textContent = 'Atual: ' + path;
    } else {
      if (!editingObra.gallery) editingObra.gallery = [];
      editingObra.gallery.push(path);
      const grid = document.getElementById('gallery-grid');
      if (grid) {
        const i = editingObra.gallery.length - 1;
        grid.insertAdjacentHTML('beforeend', `
          <div class="gallery-thumb-wrap">
            <img class="gallery-thumb" src="${path}" />
            <button class="gallery-remove" onclick="removeGalleryImg(${i})">×</button>
          </div>
        `);
      }
    }
    hideProgress();
    toast('Imagem enviada!', 'success');
  } catch(e) {
    hideProgress();
    toast('Erro ao enviar imagem: ' + e.message, 'error');
  }
}

function removeGalleryImg(i) {
  editingObra.gallery.splice(i, 1);
  const grid = document.getElementById('gallery-grid');
  if (grid) {
    grid.innerHTML = (editingObra.gallery||[]).map((g,j) => `
      <div class="gallery-thumb-wrap">
        <img class="gallery-thumb" src="${g}" />
        <button class="gallery-remove" onclick="removeGalleryImg(${j})">×</button>
      </div>
    `).join('');
  }
}

// ── Save obra ──
async function saveObra() {
  editingObra.title   = document.getElementById('f-title')?.value || editingObra.title;
  editingObra.cat     = document.getElementById('f-cat')?.value   || editingObra.cat;
  editingObra.catLabel= CAT_LABELS_OBRA[editingObra.cat];
  editingObra.status  = document.getElementById('f-status')?.value|| editingObra.status;
  editingObra.city    = document.getElementById('f-city')?.value  || editingObra.city;
  editingObra.area    = document.getElementById('f-area')?.value  || editingObra.area;
  editingObra.desc    = document.getElementById('f-desc')?.value  || editingObra.desc;
  editingObra.youtube = document.getElementById('f-youtube')?.value|| editingObra.youtube;

  if (!editingObra.title) { toast('Preencha o título.', 'error'); return; }

  const idx = editingObra._index;
  delete editingObra._index;
  const obraToSave = JSON.parse(JSON.stringify(editingObra));

  showProgress('Sincronizando…');
  try {
    // Fetch fresh data from GitHub
    const fresh = await ghGet('content/obras.json');
    const freshData = JSON.parse(b64ToStr(fresh.content));

    // GitHub API may return a stale/cached SHA. If localStorage has a newer SHA, use it.
    // (localStorage SHA = what we got back from GitHub after our LAST successful save)
    const cached = lcLoad('obras');
    if (cached && cached.sha !== fresh.sha) {
      // GitHub is behind — use the real current SHA from our last save
      obrasFileSHA = cached.sha;
      window._obrasCats = cached.cats;
      obras = JSON.parse(JSON.stringify(cached.data)); // base: our last saved state
    } else {
      obrasFileSHA = fresh.sha;
      window._obrasCats = freshData.cats;
      obras = freshData.obras;
    }

    if (isNew) obras.push(obraToSave);
    else obras[idx] = obraToSave;

    showProgress('Salvando obra no GitHub…');
    let res;
    try {
      res = await ghPut('content/obras.json', jsonStringifyAscii({cats: window._obrasCats, obras}), obrasFileSHA, `Admin: ${isNew?'adiciona':'edita'} obra "${obraToSave.title}"`);
    } catch(conflictErr) {
      // If SHA still wrong, do one final retry with a direct re-fetch
      if (conflictErr.message.includes('does not match') || conflictErr.message.includes('409') || conflictErr.message.includes('422')) {
        showProgress('Resolvendo conflito, aguarde…');
        await new Promise(r => setTimeout(r, 2000)); // wait 2s for GitHub cache
        const fresh2 = await ghGet('content/obras.json');
        obrasFileSHA = fresh2.sha;
        const freshData2 = JSON.parse(b64ToStr(fresh2.content));
        window._obrasCats = freshData2.cats;
        obras = freshData2.obras;
        if (isNew) obras.push(obraToSave);
        else obras[idx] = obraToSave;
        res = await ghPut('content/obras.json', jsonStringifyAscii({cats: window._obrasCats, obras}), obrasFileSHA, `Admin: ${isNew?'adiciona':'edita'} obra "${obraToSave.title}"`);
      } else {
        throw conflictErr;
      }
    }
    obrasFileSHA = res.content.sha;
    lcSave('obras', obras, window._obrasCats, obrasFileSHA); // persist locally
    closeModal();
    renderList();
    toast(isNew ? 'Obra adicionada! Site atualizado em ~1 min.' : 'Obra salva! Site atualizado em ~1 min.', 'success');
  } catch(e) {
    hideProgress();
    toast('Erro ao salvar: ' + e.message, 'error');
  }
  hideProgress();
}

// ── Save post ──

    } catch(conflictErr) {
      if (conflictErr.message.includes('does not match') || conflictErr.message.includes('409') || conflictErr.message.includes('422')) {
        showProgress('Resolvendo conflito, aguarde…');
        await new Promise(r => setTimeout(r, 2000));
        const fresh2 = await ghGet('content/blog.json');
        blogFileSHA = fresh2.sha;
        const freshData2 = JSON.parse(b64ToStr(fresh2.content));
        window._blogCats = freshData2.cats;
        posts = freshData2.posts;
        if (isNew) posts.push(postToSave);
        else posts[idx] = postToSave;
        res = await ghPut('content/blog.json', jsonStringifyAscii({cats: window._blogCats, posts}), blogFileSHA, `Admin: ${isNew?'adiciona':'edita'} post "${postToSave.title}"`);
      } else {
        throw conflictErr;
      }
    }
    blogFileSHA = res.content.sha;
    lcSave('blog', posts, window._blogCats, blogFileSHA); // persist locally
    closeModal();
    renderList();

  } catch(e) {
    hideProgress();
    toast('Erro ao salvar: ' + e.message, 'error');
  }
  hideProgress();
}

// ── Delete ──
async function deleteObra(i) {
  if (!confirm(`Remover "${obras[i].title}"? Esta ação não pode ser desfeita.`)) return;
  const removed = obras.splice(i, 1)[0];
  showProgress('Removendo…');
  try {
    const content = jsonStringifyAscii({cats: window._obrasCats, obras});
    const res = await ghPut('content/obras.json', content, obrasFileSHA, `Admin: remove obra "${removed.title}"`);
    obrasFileSHA = res.content.sha;
    lcSave('obras', obras, window._obrasCats, obrasFileSHA);
    renderList();
    toast('Obra removida.', 'success');
  } catch(e) {
    obras.splice(i, 0, removed);
    toast('Erro ao remover: ' + e.message, 'error');
  }
  hideProgress();
}

async function deletePost(i) {
  if (!confirm(`Remover "${posts[i].title}"? Esta ação não pode ser desfeita.`)) return;
  const removed = posts.splice(i, 1)[0];
  showProgress('Removendo…');
  try {
    const content = jsonStringifyAscii({cats: window._blogCats, posts});
    const res = await ghPut('content/blog.json', content, blogFileSHA, `Admin: remove post "${removed.title}"`);
    blogFileSHA = res.content.sha;
    lcSave('blog', posts, window._blogCats, blogFileSHA);
    renderList();
    toast('Artigo removido.', 'success');
  } catch(e) {
    posts.splice(i, 0, removed);
    toast('Erro ao remover: ' + e.message, 'error');
  }
  hideProgress();
}

// ── Modal ──
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').style.display = 'none';
  editingObra = null; editingPost = null;
}

// ── UI helpers ──
function showProgress(msg) {
  document.getElementById('progress-text').textContent = msg || 'Aguarde…';
  document.getElementById('progress-overlay').classList.add('visible');
}
function hideProgress() {
  document.getElementById('progress-overlay').classList.remove('visible');
}

let toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type||''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function slugify(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// Store cats for saving (loaded with the JSON)
// Decode base64 from GitHub API correctly (handles UTF-8 multi-byte chars)
function b64ToStr(b64) {
  const bytes = Uint8Array.from(atob(b64.replace(/\n/g,'')), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

async function loadAll() {
  try {
    const [obrasFile, blogFile] = await Promise.all([ghGet('content/obras.json'), ghGet('content/blog.json')]);

    // Obras: prefer localStorage if it has a newer SHA (GitHub API may serve stale cache)
    const obrasCache = lcLoad('obras');
    const od = JSON.parse(b64ToStr(obrasFile.content));
    window._obrasCats = od.cats;
    if (obrasCache && obrasCache.sha !== obrasFile.sha) {
      // Our last save (localStorage) differs from GitHub response — GitHub may be stale.
      // Use localStorage data + localStorage SHA (it's the real current SHA on GitHub).
      obras = obrasCache.data;
      window._obrasCats = obrasCache.cats;
      obrasFileSHA = obrasCache.sha;
      console.log('[Admin] obras: usando cache local (SHA diverge do GitHub)');
    } else {
      obras = od.obras;
      obrasFileSHA = obrasFile.sha;
    }

    // Blog: same logic
    const blogCache = lcLoad('blog');
    const bd = JSON.parse(b64ToStr(blogFile.content));
    window._blogCats = bd.cats;
    if (blogCache && blogCache.sha !== blogFile.sha) {
      posts = blogCache.data;
      window._blogCats = blogCache.cats;
      blogFileSHA = blogCache.sha;
      console.log('[Admin] blog: usando cache local (SHA diverge do GitHub)');
    } else {
      posts = bd.posts;
      blogFileSHA = blogFile.sha;
    }

    return true;
  } catch(e) {
    // Network error — fall back to localStorage if available
    const obrasCache = lcLoad('obras');
    const blogCache = lcLoad('blog');
    if (obrasCache) { obras = obrasCache.data; window._obrasCats = obrasCache.cats; obrasFileSHA = obrasCache.sha; }
    if (blogCache)  { posts = blogCache.data;  window._blogCats = blogCache.cats;   blogFileSHA = blogCache.sha; }
    if (obrasCache || blogCache) { console.log('[Admin] offline: usando cache local'); return true; }
    console.error('loadAll error', e);
    return false;
  }
}

// Enter to submit login
document.getElementById('token-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
