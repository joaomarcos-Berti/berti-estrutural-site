backend:
  name: github
  repo: joaomarcos-Berti/berti-estrutural-site
  branch: main
  base_url: https://berti-cms-auth.joaomarcos-695.workers.dev

media_folder: "assets/photos"
public_folder: "/assets/photos"

locale: pt

collections:

  - name: "portfolio"
    label: "Portfólio de Obras"
    files:
      - label: "Obras e Categorias"
        name: "obras_data"
        file: "content/obras.json"
        format: json
        fields:
          - label: "Obras"
            name: "obras"
            widget: "list"
            label_singular: "Obra"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID",                name: "id",       widget: "number" }
              - { label: "Título",            name: "title",    widget: "string" }
              - { label: "Categoria (key)",   name: "cat",      widget: "string" }
              - { label: "Categoria (label)", name: "catLabel", widget: "string" }
              - { label: "Cidade",            name: "city",     widget: "string" }
              - { label: "Área",              name: "area",     widget: "string" }
              - { label: "Status",            name: "status",   widget: "string" }
              - { label: "Descrição",         name: "desc",     widget: "text" }
              - { label: "Imagem de capa",    name: "cover",    widget: "string" }
              - { label: "YouTube",           name: "youtube",  widget: "string", required: false }
              - label: "Galeria de fotos"
                name: "gallery"
                widget: "list"
                field: { label: "Foto", name: "photo", widget: "string" }
          - label: "Categorias"
            name: "cats"
            widget: "list"
            label_singular: "Categoria"
            fields:
              - { label: "Key",   name: "key",   widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
