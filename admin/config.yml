backend:
  name: github
  repo: joaomarcos-Berti/berti-estrutural-site
  branch: main
  base_url: https://berti-cms-auth.workers.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: pt

collections:

  # PORTFOLIO
  - name: "portfolio"
    label: "Portfólio de Obras"
    files:
      - label: "Lista de obras"
        name: "portfolio_items"
        file: "content/portfolio.json"
        format: json
        fields:
          - label: "Obras"
            name: "items"
            widget: "list"
            label_singular: "Obra"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título da obra",          name: "title",      widget: "string" }
              - label: "Categoria"
                name: "category"
                widget: "select"
                options:
                  - { label: "Industrial",    value: "industrial" }
                  - { label: "Logística",     value: "logistica" }
                  - { label: "Comercial",     value: "comercial" }
                  - { label: "Agroindustrial",value: "agroindustrial" }
              - { label: "ID YouTube",              name: "youtube_id", widget: "string",  required: false }
              - { label: "Foto da obra",            name: "thumbnail",  widget: "image",   required: false }
              - { label: "Localização",             name: "location",   widget: "string" }
              - { label: "Área",                    name: "area",       widget: "string",  required: false }
              - { label: "Detalhes técnicos",       name: "details",    widget: "string",  required: false }
              - { label: "Destaque",                name: "featured",   widget: "boolean", default: false }

  # BLOG
  - name: "blog"
    label: "Blog Técnico"
    files:
      - label: "Artigos do blog"
        name: "blog_posts"
        file: "content/blog.json"
        format: json
        fields:
          - label: "Artigos"
            name: "posts"
            widget: "list"
            label_singular: "Artigo"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID (slug)",           name: "id",       widget: "string" }
              - label: "Categoria"
                name: "cat"
                widget: "select"
                options:
                  - { label: "Engenharia",    value: "engenharia" }
                  - { label: "Tecnologia",    value: "tecnologia" }
                  - { label: "Materiais",     value: "materiais" }
                  - { label: "Gestão de Obra",value: "gestao" }
              - { label: "Label da categoria",  name: "catLabel", widget: "string" }
              - { label: "Título",              name: "title",    widget: "string" }
              - { label: "Resumo",              name: "excerpt",  widget: "text" }
              - { label: "imagem de capa",      name: "cover",    widget: "image",   required: false }
              - { label: "Data",                name: "date",     widget: "string" }
              - { label: "Tempo de leitura",    name: "read",     widget: "string",  default: "5 min" }
              - { label: "Autor",               name: "author",   widget: "string",  default: "Equipe Berti" }
              - { label: "Destaque",            name: "featured", widget: "boolean", default: false }
              - { label: "Conteúdo completo",   name: "body",     widget: "markdown" }
          - label: "Categorias do blog"
            name: "cats"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Chave", name: "key",   widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
